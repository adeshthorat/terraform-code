name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'

jobs:
#-------------------------------------CHECKOV-SCAN-JOB----------------------------------------#  
  checkov-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set timestamp
        id: timestamp
        run: echo "ts=$(date +'%d%m%y-%H%M')" >> $GITHUB_OUTPUT

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          output_format: sarif
          output_file_path: checkov-report/checkov-report${{ steps.timestamp.outputs.ts }}.sarif
        continue-on-error: true

      - name: Commit SARIF report to repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add checkov-report/
          git commit -m "Add Checkov report ${{ steps.timestamp.outputs.ts }}"
          BRANCH_NAME=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "Pushing to branch: $BRANCH_NAME" 
          git push origin HEAD:${BRANCH_NAME}    

      - name: Upload SARIF report artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-report/checkov-report${{ steps.timestamp.outputs.ts }}.sarif

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-report/checkov-report${{ steps.timestamp.outputs.ts }}.sarif

#-------------------------------------TERRAFORM-PLAN-JOB----------------------------------------#  

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: checkov-scan
    if: success()
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="key=tfstate/terraform.tfstate" -backend-config="region=${{ secrets.AWS_REGION }}" -backend-config="use_lockfile=true"
        working-directory: ./terraform/main-infra

      - name: Terraform Plan
        run: terraform plan
        working-directory: ./terraform/main-infra
