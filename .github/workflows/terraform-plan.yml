name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
#run workflow manually from github actions tab
jobs:

#------------------------------------TFLINT-JOB-----------------------------------------------#
  terraform-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set timestamp
        id: timestamp
        run: |
         echo "ts=$(date +'%d%m%y-%H%M')" >> $GITHUB_OUTPUT

      - name: Run TFLint
        uses: terraform-linters/tflint-action@v1
        with: 
          args: --recursive
        continue-on-error: true
      
#-------------------------------------CHECKOV-SCAN-JOB----------------------------------------#  
  checkov-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set timestamp
        id: timestamp
        run: |
         echo "ts=$(date +'%d%m%y-%H%M')" >> $GITHUB_OUTPUT
         echo ${BC_FROM_BRANCH}

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./terraform
          output_format: json
          output_file_path: checkov-report/checkov-report${{ steps.timestamp.outputs.ts }}.json
        continue-on-error: true

      - name: Commit SARIF report to repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          BRANCH_NAME=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          git pull --rebase origin $BRANCH_NAME
          git add checkov-report/
          git commit -m "Add Checkov report ${{ steps.timestamp.outputs.ts }}" || echo "No changes to commit"
          echo "Pushing to branch: $BRANCH_NAME"
          git push origin HEAD:${BRANCH_NAME}
          git status

#-------------------------------------TERRATEST-JOB----------------------------------------#

  terratest:
    runs-on: ubuntu-latest
    needs: [terraform-lint, checkov-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Run Terratest
        run: |
          cd test
          go test -v -timeout 30m

#-------------------------------------TERRAFORM-PLAN-JOB----------------------------------------#  

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terratest
    if: success()
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="key=tfstate/terraform.tfstate" -backend-config="region=${{ secrets.AWS_REGION }}" -backend-config="use_lockfile=true"
        working-directory: ./terraform/main-infra

      - name: Terraform Plan
        run: terraform plan
        working-directory: ./terraform/main-infra
