name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
  workflow_dispatch:

jobs:
  #------------------------------------SCA & SECURITY SCAN--------------------------------------#
  security-and-sca:
    name: Security and SCA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # for SARIF upload
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        id: tflint
        run: |
          echo "### TFLint Results" >> $GITHUB_STEP_SUMMARY
          tflint --recursive --format compact >> $GITHUB_STEP_SUMMARY || echo "TFLint found issues"
        continue-on-error: true

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
        continue-on-error: true

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: ./terraform
        continue-on-error: true

      - name: Generate Security Summary
        run: |
          echo "### Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "Security scans completed. Check artifacts for detailed reports." >> $GITHUB_STEP_SUMMARY
          echo "- **Checkov**: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **tfsec**: Completed" >> $GITHUB_STEP_SUMMARY


  #-------------------------------------TERRATEST-JOB----------------------------------------#
  terratest:
    name: Terratest
    runs-on: ubuntu-latest
    needs: security-and-sca
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Run Terratest
        run: |
          if [ -d "test" ]; then
            cd test
            go test -v -timeout 30m
          else
            echo "No 'test' directory found. Skipping Terratest."
          fi

  #-------------------------------------TERRAFORM-PLAN-JOB----------------------------------------#
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terratest
    if: success()
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="key=tfstate/terraform.tfstate" -backend-config="region=${{ secrets.AWS_REGION }}" -backend-config="use_lockfile=true"
        working-directory: ./terraform/main-infra

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        working-directory: ./terraform/main-infra

      - name: Add Plan to Summary
        run: |
          echo "### Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo '```hcl' >> $GITHUB_STEP_SUMMARY
          terraform show -no-color tfplan >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Plan output hidden or unavailable" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        working-directory: ./terraform/main-infra
        continue-on-error: true
